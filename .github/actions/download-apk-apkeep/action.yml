name: Download APK with apkeep
description: Download an APK from Google Play or APKPure using EFF apkeep
inputs:
  packageName:
    description: Android application ID
    required: true
  source:
    description: apkeep download source (google-play or apk-pure)
    required: false
    default: google-play
  apkeepVersion:
    description: apkeep crate version to install with cargo
    required: false
    default: "1.0.0"
outputs:
  found:
    description: Whether the package could be resolved on the chosen source
    value: ${{ (steps.cached.outputs.apkPath || steps.download.outputs.apkPath) != '' }}
  apkPath:
    description: Path to the downloaded APK file
    value: ${{ steps.cached.outputs.apkPath || steps.download.outputs.apkPath }}

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        rustflags: ''
        cache-shared-key: apkeep-${{ inputs.apkeepVersion }}

    - name: Install apkeep
      shell: bash
      id: apkeep
      env:
        APKEEP_VERSION: ${{ inputs.apkeepVersion }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/apkeep.lib.sh"
        echo "bin=$(apkeep_install "$APKEEP_VERSION")" >> "$GITHUB_OUTPUT"

    - name: Restore APK cache
      id: apkCache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/apkeep-${{ inputs.source }}-apk-cache
        key: apkeep-${{ inputs.source }}-${{ inputs.packageName }}

    - name: Use the cached APK when it is still usable
      id: cached
      if: steps.apkCache.outputs.cache-hit == 'true'
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.packageName }}
        CACHE_DIR: ${{ runner.temp }}/apkeep-${{ inputs.source }}-apk-cache
      run: |
        source "${GITHUB_ACTION_PATH}/apkeep.lib.sh"
        if apkPath=$(apkeep_resolve_scannable_apk "$CACHE_DIR" "$PACKAGE_NAME"); then
          echo "apkPath=$apkPath" >> "$GITHUB_OUTPUT"
        fi

    # A missing credential is a set-up error and fails the job. An app that is not in the store
    # is not an error: the download step below just leaves apkPath empty.
    - name: Require Google Play credentials
      if: steps.cached.outputs.apkPath == '' && inputs.source == 'google-play' && (env.GPLAY_EMAIL == '' || env.GPLAY_AAS_TOKEN == '')
      shell: bash
      run: |
        echo "GPLAY_EMAIL and GPLAY_AAS_TOKEN must be set for Google Play downloads." >&2
        exit 1

    - name: Download from the store
      id: download
      if: steps.cached.outputs.apkPath == ''
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.packageName }}
        APKEEP_BIN: ${{ steps.apkeep.outputs.bin }}
        APKEEP_SOURCE: ${{ inputs.source }}
        GPLAY_EMAIL: ${{ env.GPLAY_EMAIL }}
        GPLAY_AAS_TOKEN: ${{ env.GPLAY_AAS_TOKEN }}
        CACHE_DIR: ${{ runner.temp }}/apkeep-${{ inputs.source }}-apk-cache
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/apkeep.lib.sh"
        if ! apkPath=$(apkeep_download "$APKEEP_BIN" "$PACKAGE_NAME" "$APKEEP_SOURCE" \
          "${RUNNER_TEMP}/apkeep-download" "${GPLAY_EMAIL:-}" "${GPLAY_AAS_TOKEN:-}"); then
          exit 0
        fi
        mkdir -p "$CACHE_DIR"
        rm -f "${CACHE_DIR:?}"/*.apk "${CACHE_DIR:?}"/*.xapk 2>/dev/null || true
        cp "$apkPath" "${CACHE_DIR}/${PACKAGE_NAME}.apk"
        echo "apkPath=${CACHE_DIR}/${PACKAGE_NAME}.apk" >> "$GITHUB_OUTPUT"
