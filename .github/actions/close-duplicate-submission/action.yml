name: Close duplicate submission issue
description: Close the current issue as a duplicate of an existing submission or data.yml entry
inputs:
  duplicateOf:
    description: Issue number of the original submission or data.yml entry
    required: true
  currentIssue:
    description: Issue number being closed
    required: true
  currentAuthor:
    description: Login of the issue author
    required: true
  issueBody:
    description: Full GitHub issue body (fetched when empty, for Codeberg mirroring)
    required: false
    default: ""
  codebergToken:
    description: Codeberg personal access token for mirroring comments
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Remove the action labels
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        NUMBER: ${{ inputs.currentIssue }}
      run: |
        for label in "Run Checks" "Create PR" "Commit As-Is"; do
          gh issue edit "$NUMBER" --repo "$GH_REPO" --remove-label "$label" || true
        done

    - name: Flag the original issue when someone else submitted it
      if: inputs.duplicateOf != inputs.currentIssue
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        DUPLICATE_OF: ${{ inputs.duplicateOf }}
        CURRENT_AUTHOR: ${{ inputs.currentAuthor }}
      run: |
        set -euo pipefail
        original_author=$(gh api "repos/${GH_REPO}/issues/${DUPLICATE_OF}" --jq '.user.login')
        if [[ "$CURRENT_AUTHOR" != "$original_author" ]]; then
          gh issue edit "$DUPLICATE_OF" --repo "$GH_REPO" --add-label "Duplicates Exist"
        fi

    - name: Close as a duplicate of the original
      if: inputs.duplicateOf != inputs.currentIssue
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        NUMBER: ${{ inputs.currentIssue }}
        DUPLICATE_OF: ${{ inputs.duplicateOf }}
      run: |
        gh issue close "$NUMBER" --repo "$GH_REPO" --duplicate-of "$DUPLICATE_OF"

    - name: Close as already tracked
      if: inputs.duplicateOf == inputs.currentIssue
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        NUMBER: ${{ inputs.currentIssue }}
      run: |
        gh issue close "$NUMBER" --repo "$GH_REPO"

    # --duplicate-of leaves no comment, and the Codeberg mirror is built from the bot's comments.
    - name: Say why it was closed
      uses: ./.github/actions/issue-comment
      with:
        issueNumber: ${{ inputs.currentIssue }}
        body: ${{ inputs.duplicateOf == inputs.currentIssue && 'This package and signature are already tracked in an open submission or in data.yml.' || format('Duplicate of GH-{0}.', inputs.duplicateOf) }}
        issueBody: ${{ inputs.issueBody }}
        codebergToken: ${{ inputs.codebergToken }}
