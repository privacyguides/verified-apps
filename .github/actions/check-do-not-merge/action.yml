name: Check merge-blocking labels
description: Fail when the submission issue or pull request has Do Not Merge or Needs a +1
inputs:
  issueNumber:
    description: Submission issue number
    required: false
    default: ""
  pullRequestNumber:
    description: Pull request number
    required: false
    default: ""
  actionDescription:
    description: Short description of the blocked action (e.g. "Create PR")
    required: false
    default: "this workflow"
  issueBody:
    description: Full GitHub issue body (fetched when empty, for Codeberg mirroring)
    required: false
    default: ""
  codebergToken:
    description: Codeberg personal access token for mirroring comments
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Require an issue or pull request number
      if: inputs.issueNumber == '' && inputs.pullRequestNumber == ''
      shell: bash
      run: |
        echo "At least one of issueNumber or pullRequestNumber is required." >&2
        exit 1

    - name: Look for a blocking label
      id: block
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        ISSUE_NUMBER: ${{ inputs.issueNumber }}
        PR_NUMBER: ${{ inputs.pullRequestNumber }}
        ACTION: ${{ inputs.actionDescription }}
      run: |
        set -euo pipefail
        # stdin: label names, one per line. Prints the blocking label, if any.
        blocking() {
          local labels blocker
          labels=$(cat)
          for blocker in 'Do Not Merge' 'Needs a +1'; do
            if grep -qxF "$blocker" <<< "$labels"; then
              printf '%s' "$blocker"
              return
            fi
          done
        }

        label=""
        where=""
        if [[ -n "$ISSUE_NUMBER" ]]; then
          label=$(gh issue view "$ISSUE_NUMBER" --repo "$GH_REPO" --json labels -q '.labels[].name' | blocking)
          where="issue GH-${ISSUE_NUMBER}"
        fi
        if [[ -z "$label" && -n "$PR_NUMBER" ]]; then
          label=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json labels -q '.labels[].name' | blocking)
          where="pull request GH-${PR_NUMBER}"
        fi
        if [[ -n "$label" ]]; then
          {
            echo "label=$label"
            echo "where=$where"
            echo "message=Cannot run **${ACTION}**: ${where} has the **${label}** label. Remove that label before retrying."
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Comment on the pull request
      if: steps.block.outputs.label != '' && inputs.pullRequestNumber != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pullRequestNumber }}
        MESSAGE: ${{ steps.block.outputs.message }}
      run: |
        gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body "$MESSAGE"

    - name: Comment on the issue
      if: steps.block.outputs.label != '' && inputs.issueNumber != ''
      uses: ./.github/actions/issue-comment
      with:
        issueNumber: ${{ inputs.issueNumber }}
        body: ${{ steps.block.outputs.message }}
        issueBody: ${{ inputs.issueBody }}
        codebergToken: ${{ inputs.codebergToken }}

    - name: Refuse to proceed
      if: steps.block.outputs.label != ''
      shell: bash
      env:
        WHERE: ${{ steps.block.outputs.where }}
        LABEL: ${{ steps.block.outputs.label }}
      run: |
        echo "::error::${WHERE} has the ${LABEL} label; refusing to proceed."
        exit 1
