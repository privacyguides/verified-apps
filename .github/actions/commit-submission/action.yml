name: Prepare submission commit
description: Merge store-matched signatures into data.yml and write the commit message.
inputs:
  packageName:
    description: Android application ID
    required: true
  packageSignature:
    description: Submitter-provided SHA-256 fingerprint(s)
    required: true
  issueNumber:
    description: Submission issue number
    required: true
  issueBody:
    description: Full GitHub issue body (for Submission Source parsing)
    required: false
    default: ""
  coAuthorTrailer:
    description: Co-authored-by trailer(s) for the git commit (reviewer and GitHub Actions)
    required: true
  fdroidResultsDir:
    description: Directory of per-repo F-Droid result JSON files
    required: false
    default: ""
  gplaySignature:
    description: Fingerprint(s) from Google Play
    required: false
    default: ""
  appverifierSignature:
    description: Fingerprint(s) from the matched AppVerifier signing configuration
    required: false
    default: ""
  directApkSignature:
    description: Fingerprint(s) from direct APK download
    required: false
    default: ""
  directApkLink:
    description: Link to the direct APK that was downloaded (when applicable)
    required: false
    default: ""
  directApkSha256:
    description: SHA-256 of the direct APK file bytes (when applicable)
    required: false
    default: ""
  customFdroidRepoUrl:
    description: Link to the custom F-Droid repository URL (when applicable)
    required: false
    default: ""
  customFdroidApkSha256:
    description: SHA-256 of the APK from the custom F-Droid repository (when applicable)
    required: false
    default: ""
  gplayApkSha256:
    description: SHA-256 of the Google Play APK (when applicable)
    required: false
    default: ""
  apkpureSignature:
    description: Fingerprint(s) from APKPure
    required: false
    default: ""
  apkpureApkSha256:
    description: SHA-256 of the APKPure APK (when applicable)
    required: false
    default: ""
  domainVerifiedSig:
    description: Submitter signature when it is allowed by the package's verified domain (adds an HTTPS/DNS Verified Domain source)
    required: false
    default: ""
  domainMethod:
    description: Method the verification record was found via (https or dns)
    required: false
    default: ""
outputs:
  prepared:
    description: Whether submission-entry.yml and submission-commit-msg were written to the workspace
    value: ${{ steps.message.outputs.prepared == 'true' }}
  skipped:
    description: Whether there is nothing to commit (no source matched the submission)
    value: ${{ steps.entry.outputs.skipped }}

runs:
  using: composite
  steps:
    - name: Build the entry from the sources that matched
      id: entry
      shell: bash
      env:
        PACKAGE: ${{ inputs.packageName }}
        USER_SIG: ${{ inputs.packageSignature }}
        ISSUE: ${{ inputs.issueNumber }}
        ISSUE_BODY: ${{ inputs.issueBody }}
        FDROID_RESULTS_DIR: ${{ inputs.fdroidResultsDir }}
        GPLAY_SIG: ${{ inputs.gplaySignature }}
        APPVERIFIER_SIG: ${{ inputs.appverifierSignature }}
        DIRECT_SIG: ${{ inputs.directApkSignature }}
        DIRECT_APK_URL: ${{ inputs.directApkLink }}
        DIRECT_APK_SHA256: ${{ inputs.directApkSha256 }}
        CUSTOM_FDROID_REPO_URL: ${{ inputs.customFdroidRepoUrl }}
        CUSTOM_FDROID_APK_SHA256: ${{ inputs.customFdroidApkSha256 }}
        GPLAY_APK_SHA256: ${{ inputs.gplayApkSha256 }}
        APKPURE_SIG: ${{ inputs.apkpureSignature }}
        APKPURE_APK_SHA256: ${{ inputs.apkpureApkSha256 }}
        DOMAIN_VERIFIED_SIG: ${{ inputs.domainVerifiedSig }}
        DOMAIN_VERIFIED_METHOD: ${{ inputs.domainMethod }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/../signature-lib/signatures.lib.sh"

        SUBMISSION_ISSUE_REF=$(signatures_submission_issue_ref "$ISSUE" "$ISSUE_BODY")
        export SUBMISSION_ISSUE_REF
        echo "issueRef=$SUBMISSION_ISSUE_REF" >> "$GITHUB_OUTPUT"

        if submission_build_entry_file "${GITHUB_WORKSPACE}/submission-entry.yml"; then
          echo "skipped=false" >> "$GITHUB_OUTPUT"
        else
          echo "No store matched the user-provided signature(s); skipping commit." >&2
          echo "skipped=true" >> "$GITHUB_OUTPUT"
        fi

    # Nothing here is committed. Merging now makes a bad entry fail in this job, before the
    # push job takes the write lock.
    - name: Check the entry merges into data.yml
      if: steps.entry.outputs.skipped == 'false'
      shell: bash
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/../signature-lib/signatures.lib.sh"
        submission_merge_entry_into_data_yml "${GITHUB_WORKSPACE}/submission-entry.yml"

    - name: Write the commit message
      id: message
      if: steps.entry.outputs.skipped == 'false'
      shell: bash
      env:
        PACKAGE: ${{ inputs.packageName }}
        ISSUE: ${{ inputs.issueNumber }}
        ISSUE_REF: ${{ steps.entry.outputs.issueRef }}
        CO_AUTHOR_TRAILER: ${{ inputs.coAuthorTrailer }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/../signature-lib/signatures.lib.sh"
        submission_write_commit_message_file "${GITHUB_WORKSPACE}/submission-commit-msg" \
          "${ISSUE_REF}: Add ${PACKAGE}" "$ISSUE" "$CO_AUTHOR_TRAILER"
        echo "prepared=true" >> "$GITHUB_OUTPUT"
