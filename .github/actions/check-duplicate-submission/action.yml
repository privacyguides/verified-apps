name: Check duplicate submission
description: Detect if package and fingerprint already exist in data.yml or another open submission issue
inputs:
  packageName:
    description: Android application ID
    required: true
  packageSignature:
    description: One or more colon-separated SHA-256 fingerprints (newline-separated when multiple)
    required: true
  currentIssue:
    description: Issue number for the submission being checked
    required: true
  directApkUrl:
    description: Optional direct APK URL from the submission; only matches candidates with the same APK URL
    required: false
    default: ""
  customFdroidRepoUrl:
    description: Optional custom F-Droid repository URL; only matches candidates with the same repository URL
    required: false
    default: ""
outputs:
  isDuplicate:
    description: Whether a duplicate was found
    value: ${{ (steps.data.outputs.duplicateOf || steps.issues.outputs.duplicateOf) != '' }}
  duplicateOf:
    description: Issue number of the existing submission or data.yml entry (the lowest when several match)
    value: ${{ steps.data.outputs.duplicateOf || steps.issues.outputs.duplicateOf }}

runs:
  using: composite
  steps:
    - name: Look for the same entry in data.yml
      id: data
      shell: bash
      env:
        PACKAGE: ${{ inputs.packageName }}
        SIGNATURE: ${{ inputs.packageSignature }}
        DIRECT_APK_URL: ${{ inputs.directApkUrl }}
        CUSTOM_FDROID_REPO_URL: ${{ inputs.customFdroidRepoUrl }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/../signature-lib/signatures.lib.sh"

        duplicate_of=""
        if [[ -f data.yml ]] && [[ -s data.yml ]]; then
          schema=$(yq -r '.schema // 0' data.yml)
          if ! signatures_data_schema_supported "$schema"; then
            echo "Unsupported data.yml schema (expected 3 or 4): $schema" >&2
            exit 1
          fi
          while IFS= read -r row; do
            [[ -z "$row" ]] && continue
            issue_ref=$(printf '%s\n' "$row" | jq -r '.issue')
            stored_fp=$(printf '%s\n' "$row" | jq -r '.fingerprint')
            stored_link=$(printf '%s\n' "$row" | jq -r '.link')
            stored_repo=$(printf '%s\n' "$row" | jq -r '.repo')
            [[ -z "$issue_ref" || "$issue_ref" == "null" || -z "$stored_fp" ]] && continue
            if ! issue_num=$(signatures_github_issue_number "$issue_ref"); then
              continue
            fi
            if signatures_equal "$SIGNATURE" "$stored_fp" \
              && submission_same_download_source "$stored_link" "$stored_repo" "$DIRECT_APK_URL" "$CUSTOM_FDROID_REPO_URL"; then
              if [[ -z "$duplicate_of" || "$issue_num" -lt "$duplicate_of" ]]; then
                duplicate_of="$issue_num"
              fi
            fi
          done < <(
            yq -r '
              .packages[]
              | select(.package == strenv(PACKAGE))
              | .signature[]
              | .fingerprint as $fp
              | .sources[]
              | {"issue": .issue, "fingerprint": $fp, "link": (.apk.link // ""), "repo": (.apk.repo // "")}
              | @json
            ' data.yml
          )
        fi
        echo "duplicateOf=$duplicate_of" >> "$GITHUB_OUTPUT"

    - name: Look for an earlier open issue with the same submission
      id: issues
      if: steps.data.outputs.duplicateOf == ''
      shell: bash
      env:
        PACKAGE: ${{ inputs.packageName }}
        SIGNATURE: ${{ inputs.packageSignature }}
        CURRENT_ISSUE: ${{ inputs.currentIssue }}
        DIRECT_APK_URL: ${{ inputs.directApkUrl }}
        CUSTOM_FDROID_REPO_URL: ${{ inputs.customFdroidRepoUrl }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/../signature-lib/signatures.lib.sh"

        candidates_dir=$(mktemp -d)
        if ! gh issue list --repo "$GH_REPO" --state open --limit 200 \
          --search "\"${PACKAGE}\" in:body" --json number,body,title \
          > "${candidates_dir}/search.json"; then
          echo "::warning::Could not search open issues for ${PACKAGE}; only the most recent open issues were checked for duplicates."
          echo '[]' > "${candidates_dir}/search.json"
        fi
        if ! gh issue list --repo "$GH_REPO" --state open --limit 100 \
          --json number,body,title > "${candidates_dir}/recent.json"; then
          echo "::warning::Could not list the most recent open issues; a duplicate opened in the last few moments may have been missed."
          echo '[]' > "${candidates_dir}/recent.json"
        fi

        duplicate_of=""
        while IFS= read -r row; do
          [[ -z "$row" ]] && continue
          issue_num=$(printf '%s\n' "$row" | jq -r .number)
          body=$(printf '%s\n' "$row" | jq -r .body)

          if ! parsed=$(parse_verification_text "$(signatures_extract_verification_block "$body")" 2>/dev/null); then
            continue
          fi
          issue_pkg=$(printf '%s\n' "$parsed" | sed -n '1p')
          issue_sigs=$(printf '%s\n' "$parsed" | tail -n +2)
          cand_link=$(signatures_parse_issue_field "Direct download link|Direct APK Link" "$body" true)
          cand_repo=$(signatures_parse_issue_field "Custom F-Droid Repository" "$body" true)

          if [[ "$issue_pkg" == "$PACKAGE" ]] && signatures_equal "$SIGNATURE" "$issue_sigs" \
            && submission_same_download_source "$cand_link" "$cand_repo" "$DIRECT_APK_URL" "$CUSTOM_FDROID_REPO_URL"; then
            if [[ -z "$duplicate_of" || "$issue_num" -lt "$duplicate_of" ]]; then
              duplicate_of="$issue_num"
            fi
          fi
        done < <(
          jq -c -s --argjson cur "$CURRENT_ISSUE" '
            add | unique_by(.number)
            | map(select(.title | startswith("[New]:")) | select(.number < $cur)) | .[]
          ' "${candidates_dir}/search.json" "${candidates_dir}/recent.json"
        )
        rm -rf "$candidates_dir"
        echo "duplicateOf=$duplicate_of" >> "$GITHUB_OUTPUT"
