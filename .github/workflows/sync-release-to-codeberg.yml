name: Sync Release to Codeberg

on:
  release:
    types:
      - published
      - released
      - edited
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to mirror to Codeberg
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codeberg-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror release to Codeberg
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'release' ||
      github.event.release.draft == false

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CODEBERG_REPO_API: https://codeberg.org/api/v1/repos/privacyguides/verified-apps

    steps:
      - name: Require a Codeberg token and a release tag
        env:
          CB_SYNC_TOKEN: ${{ secrets.CB_SYNC_TOKEN }}
        run: |
          if [[ -z "$CB_SYNC_TOKEN" || -z "$RELEASE_TAG" ]]; then
            echo "CB_SYNC_TOKEN is not configured, or there is no release tag to sync." >&2
            exit 1
          fi

      - name: Download the Codeberg helpers
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"
          sparse-checkout: |
            .github/actions/signature-lib
          sparse-checkout-cone-mode: false

      # GitHub is the source of truth. Writes the request body for creating the same release on
      # Codeberg, including the commit the tag points at, so Forgejo can create the tag itself
      # when the git mirror has not pushed it yet.
      - name: Read the GitHub release
        id: release
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" \
            --json tagName,name,body,isDraft,isPrerelease > "${RUNNER_TEMP}/github-release.json"
          target=$(gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq '.sha' 2>/dev/null || true)
          jq --arg tag "$RELEASE_TAG" --arg target "$target" '
            {
              tag_name: $tag,
              name: (if (.name // "") == "" then $tag else .name end),
              body: (.body // ""),
              draft: false,
              prerelease: .isPrerelease
            } + (if $target != "" then {target_commitish: $target} else {} end)
          ' "${RUNNER_TEMP}/github-release.json" > "${RUNNER_TEMP}/codeberg-release.json"
          echo "draft=$(jq -r '.isDraft' "${RUNNER_TEMP}/github-release.json")" >> "$GITHUB_OUTPUT"

      - name: Skip a draft release
        if: steps.release.outputs.draft == 'true'
        run: |
          echo "GitHub release ${RELEASE_TAG} is a draft. Drafts stay on GitHub only."

      - name: Find the Codeberg release for this tag
        id: find
        if: steps.release.outputs.draft != 'true'
        env:
          CB_SYNC_TOKEN: ${{ secrets.CB_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          source .github/actions/signature-lib/signatures.lib.sh
          response=$(codeberg_api_call "$CB_SYNC_TOKEN" GET \
            "${CODEBERG_REPO_API}/releases/tags/$(jq -rn --arg x "$RELEASE_TAG" '$x | @uri')")
          case "$(printf '%s' "$response" | tail -n 1)" in
            200) echo "id=$(printf '%s' "$response" | sed '$d' | jq -r '.id // empty')" >> "$GITHUB_OUTPUT" ;;
            404) echo "No Codeberg release for ${RELEASE_TAG} yet." ;;
            *)
              echo "Codeberg get-release-by-tag failed (body, then HTTP status):" >&2
              printf '%s\n' "$response" >&2
              exit 1
              ;;
          esac

      # A release that already exists on Codeberg keeps its name and notes. Only missing assets
      # are added below.
      - name: Create the Codeberg release
        id: create
        if: steps.release.outputs.draft != 'true' && steps.find.outputs.id == ''
        env:
          CB_SYNC_TOKEN: ${{ secrets.CB_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          source .github/actions/signature-lib/signatures.lib.sh
          response=$(codeberg_api_call "$CB_SYNC_TOKEN" POST \
            "${CODEBERG_REPO_API}/releases" "${RUNNER_TEMP}/codeberg-release.json")
          if [[ "$(printf '%s' "$response" | tail -n 1)" != "201" ]]; then
            echo "Codeberg create-release failed (body, then HTTP status):" >&2
            printf '%s\n' "$response" >&2
            exit 1
          fi
          echo "id=$(printf '%s' "$response" | sed '$d' | jq -r '.id')" >> "$GITHUB_OUTPUT"

      - name: Download the GitHub release assets
        if: steps.release.outputs.draft != 'true'
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir release-assets --clobber \
            || echo "No downloadable assets on the GitHub release; nothing to upload."

      - name: Upload the assets Codeberg does not have yet
        if: steps.release.outputs.draft != 'true'
        env:
          CB_SYNC_TOKEN: ${{ secrets.CB_SYNC_TOKEN }}
          RELEASE_ID: ${{ steps.find.outputs.id || steps.create.outputs.id }}
        run: |
          set -euo pipefail
          source .github/actions/signature-lib/signatures.lib.sh
          response=$(codeberg_api_call "$CB_SYNC_TOKEN" GET \
            "${CODEBERG_REPO_API}/releases/${RELEASE_ID}/assets")
          if [[ "$(printf '%s' "$response" | tail -n 1)" != "200" ]]; then
            echo "Codeberg list-release-assets failed (body, then HTTP status):" >&2
            printf '%s\n' "$response" >&2
            exit 1
          fi
          existing_names=$(printf '%s' "$response" | sed '$d' | jq -r '.[].name')

          shopt -s nullglob
          for file in release-assets/*; do
            [[ -f "$file" ]] || continue
            name=$(basename "$file")
            if grep -Fxq -- "$name" <<< "$existing_names"; then
              echo "Skipping $name: already attached to the Codeberg release."
              continue
            fi
            echo "Uploading $name to Codeberg release $RELEASE_TAG."
            # The shared helper only sends JSON, and this is a file upload.
            status=$(curl -sS -o "${RUNNER_TEMP}/upload-response.json" -w '%{http_code}' -X POST \
              -H "Authorization: token ${CB_SYNC_TOKEN}" \
              -H "Accept: application/json" \
              -F "attachment=@${file};filename=${name}" \
              "${CODEBERG_REPO_API}/releases/${RELEASE_ID}/assets?name=$(jq -rn --arg x "$name" '$x | @uri')")
            if [[ "$status" != "201" ]]; then
              echo "Codeberg upload-asset failed for $name (HTTP $status):" >&2
              cat "${RUNNER_TEMP}/upload-response.json" >&2
              exit 1
            fi
          done
          echo "Done syncing $RELEASE_TAG to Codeberg."
