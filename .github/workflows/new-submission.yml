name: Process Submission

on:
  issues:
    types:
      - labeled

cache-mode: read

concurrency:
  group: submission-${{ github.event.issue.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  parse:
    name: Parse Submission
    runs-on: ubuntu-latest
    outputs:
      packageName: ${{ steps.parsed.outputs.packageName }}
      packageSignature: ${{ steps.parsed.outputs.packageSignature }}
      apkUrl: ${{ steps.parsed.outputs.apkUrl }}
      customFdroidRepoUrl: ${{ steps.parsed.outputs.customFdroidRepoUrl }}
      submissionIssueRef: ${{ steps.parsed.outputs.submissionIssueRef }}
      isDuplicate: ${{ steps.duplicateCheck.outputs.isDuplicate }}
      duplicateOf: ${{ steps.duplicateCheck.outputs.duplicateOf }}
      checkApkpure: ${{ contains(github.event.issue.labels.*.name, 'Check APKPure') }}

    if: >-
      ${{
        github.event.label.name == 'Run Checks' ||
        github.event.label.name == 'Create PR' ||
        github.event.label.name == 'Commit As-Is'
      }}

    permissions:
      contents: read
      issues: read

    steps:
      - name: Download Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"

      - name: Parse verification info
        id: parsed
        uses: ./.github/actions/parse-verification-info
        with:
          issueBody: ${{ github.event.issue.body }}
          issueNumber: ${{ github.event.issue.number }}

      # Issue text reaches scripts through env only. An expression pasted into run: is executed
      # as shell, and the two links below are free text typed by the submitter.
      - name: Print parsed submission
        env:
          LABELS: ${{ toJSON(github.event.issue.labels) }}
          PACKAGE_NAME: ${{ steps.parsed.outputs.packageName }}
          SIGNATURE: ${{ steps.parsed.outputs.packageSignature }}
          ISSUE_REF: ${{ steps.parsed.outputs.submissionIssueRef }}
          APK_URL: ${{ steps.parsed.outputs.apkUrl }}
          FDROID_REPO_URL: ${{ steps.parsed.outputs.customFdroidRepoUrl }}
        run: |
          echo "Labels: $LABELS"
          echo "Package Name: $PACKAGE_NAME"
          echo "Signature: $SIGNATURE"
          echo "Submission issue ref: $ISSUE_REF"
          echo "Direct APK Link: $APK_URL"
          echo "Custom F-Droid Repository: $FDROID_REPO_URL"

      - name: Validate parsed submission
        uses: ./.github/actions/signature-lib
        with:
          operation: validate-submission
          packageName: ${{ steps.parsed.outputs.packageName }}
          packageSignature: ${{ steps.parsed.outputs.packageSignature }}

      - name: Check for duplicate submission
        id: duplicateCheck
        uses: ./.github/actions/check-duplicate-submission
        with:
          packageName: ${{ steps.parsed.outputs.packageName }}
          packageSignature: ${{ steps.parsed.outputs.packageSignature }}
          currentIssue: ${{ github.event.issue.number }}
          directApkUrl: ${{ steps.parsed.outputs.apkUrl }}
          customFdroidRepoUrl: ${{ steps.parsed.outputs.customFdroidRepoUrl }}

  closeDuplicate:
    name: Close Duplicate Submission
    runs-on: ubuntu-latest
    needs: parse
    if: >-
      needs.parse.outputs.isDuplicate == 'true' &&
      (
        github.event.label.name == 'Run Checks' ||
        github.event.label.name == 'Create PR' ||
        github.event.label.name == 'Commit As-Is'
      )

    permissions:
      issues: write

    steps:
      - name: Download Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"
          
      - name: Close issue as duplicate
        uses: ./.github/actions/close-duplicate-submission
        with:
          duplicateOf: ${{ needs.parse.outputs.duplicateOf }}
          currentIssue: ${{ github.event.issue.number }}
          currentAuthor: ${{ github.event.issue.user.login }}
          issueBody: ${{ github.event.issue.body }}
          codebergToken: ${{ secrets.CB_SYNC_TOKEN }}

  labelUserSpecifiedDownload:
    name: Label User-Specified Download
    runs-on: ubuntu-latest
    needs: parse
    if: >-
      needs.parse.outputs.isDuplicate != 'true' &&
      github.event.label.name == 'Run Checks' &&
      (
        needs.parse.outputs.apkUrl != '' ||
        needs.parse.outputs.customFdroidRepoUrl != ''
      )

    permissions:
      issues: write

    steps:
      - name: Add User-Specified Download label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$NUMBER" --repo "$GH_REPO" --add-label "User-Specified Download"

  fdroid:
    name: F-Droid
    runs-on: ubuntu-latest
    needs: parse
    cache-mode: write
    if: needs.parse.outputs.isDuplicate != 'true' && (github.event.label.name == 'Run Checks' || github.event.label.name == 'Create PR' || github.event.label.name == 'Commit As-Is')
    continue-on-error: true
    permissions:
      contents: read

    strategy:
      matrix:
        fDroidRepoName: ["F-Droid", "IzzyOnDroid"]
        include:
          - fDroidRepoName: F-Droid
            fDroidRepoURL: https://f-droid.org/repo
          - fDroidRepoName: IzzyOnDroid
            fDroidRepoURL: https://apt.izzysoft.de/fdroid/repo

    env:
      PACKAGE_NAME: ${{ needs.parse.outputs.packageName }}
      USER_SIGNATURE: ${{ needs.parse.outputs.packageSignature }}

    steps:
      - name: Download Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"

      - name: Download F-Droid App
        id: appDownload
        uses: ./.github/actions/download-fdroid
        with:
          packageName: ${{ env.PACKAGE_NAME }}
          fDroidRepoName: ${{ matrix.fDroidRepoName }}
          fDroidRepoURL: ${{ matrix.fDroidRepoURL }}

      - name: Verify APK signature
        id: verify
        if: steps.appDownload.outputs.found == 'true'
        uses: ./.github/actions/verify-store-apk
        with:
          apkPath: ${{ steps.appDownload.outputs.apkPath }}
          packageName: ${{ env.PACKAGE_NAME }}
          userSignature: ${{ env.USER_SIGNATURE }}
          summaryPrefix: F-Droid (${{ matrix.fDroidRepoName }})

      - name: Upload F-Droid result
        if: always()
        uses: ./.github/actions/write-fdroid-result
        with:
          repoName: ${{ matrix.fDroidRepoName }}
          artifactName: fdroid-result-${{ matrix.fDroidRepoName }}
          found: ${{ steps.appDownload.outputs.found }}
          signature: ${{ steps.verify.outputs.signature }}
          apkSha256: ${{ steps.verify.outputs.apkSha256 }}
          match: ${{ steps.verify.outputs.status }}
          packageName: ${{ steps.verify.outputs.matchPackageName }}
          infoNote: ${{ steps.verify.outputs.infoNote }}
          storeSignedMatch: ${{ steps.verify.outputs.storeSignedMatch }}

  customFdroid:
    name: Custom F-Droid Repository
    runs-on: ubuntu-latest
    needs: parse
    if: needs.parse.outputs.isDuplicate != 'true' && (github.event.label.name == 'Run Checks' || github.event.label.name == 'Create PR' || github.event.label.name == 'Commit As-Is') && needs.parse.outputs.customFdroidRepoUrl != ''
    continue-on-error: true
    permissions:
      contents: read

    outputs:
      signature: ${{ steps.verify.outputs.signature }}
      apkSha256: ${{ steps.verify.outputs.apkSha256 }}

    env:
      PACKAGE_NAME: ${{ needs.parse.outputs.packageName }}
      USER_SIGNATURE: ${{ needs.parse.outputs.packageSignature }}
      FDROID_REPO_URL: ${{ needs.parse.outputs.customFdroidRepoUrl }}

    steps:
      - name: Download Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"

      - name: Resolve custom repository label
        id: customRepo
        env:
          FDROID_REPO_URL: ${{ env.FDROID_REPO_URL }}
        run: |
          set -euo pipefail
          source .github/actions/signature-lib/signatures.lib.sh
          host=$(signatures_fdroid_repo_host_from_url "$FDROID_REPO_URL")
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Download F-Droid App
        id: appDownload
        uses: ./.github/actions/download-fdroid
        with:
          packageName: ${{ env.PACKAGE_NAME }}
          fDroidRepoName: ${{ steps.customRepo.outputs.host }}
          fDroidRepoURL: ${{ env.FDROID_REPO_URL }}

      - name: Verify APK signature
        id: verify
        if: steps.appDownload.outputs.found == 'true'
        uses: ./.github/actions/verify-store-apk
        with:
          apkPath: ${{ steps.appDownload.outputs.apkPath }}
          packageName: ${{ env.PACKAGE_NAME }}
          userSignature: ${{ env.USER_SIGNATURE }}
          summaryPrefix: F-Droid (${{ steps.customRepo.outputs.host }})

      - name: Upload F-Droid result
        if: always()
        uses: ./.github/actions/write-fdroid-result
        with:
          repoName: ${{ steps.customRepo.outputs.host }}
          artifactName: fdroid-result-${{ steps.customRepo.outputs.host }}
          found: ${{ steps.appDownload.outputs.found }}
          signature: ${{ steps.verify.outputs.signature }}
          apkSha256: ${{ steps.verify.outputs.apkSha256 }}
          match: ${{ steps.verify.outputs.status }}
          packageName: ${{ steps.verify.outputs.matchPackageName }}
          infoNote: ${{ steps.verify.outputs.infoNote }}
          storeSignedMatch: ${{ steps.verify.outputs.storeSignedMatch }}

  gplay:
    name: Google Play
    runs-on: ubuntu-latest
    needs: parse
    cache-mode: write
    concurrency:
      group: gplay-downloads
      cancel-in-progress: false
      queue: max

    if: needs.parse.outputs.isDuplicate != 'true' && (github.event.label.name == 'Run Checks' || github.event.label.name == 'Create PR' || github.event.label.name == 'Commit As-Is')
    continue-on-error: true
    permissions:
      contents: read

    outputs:
      found: ${{ steps.appDownload.outputs.found }}
      signature: ${{ steps.verify.outputs.signature }}
      apkSha256: ${{ steps.verify.outputs.apkSha256 }}
      match: ${{ steps.verify.outputs.status }}
      packageName: ${{ steps.verify.outputs.matchPackageName }}
      infoNote: ${{ steps.verify.outputs.infoNote }}
      storeSignedMatch: ${{ steps.verify.outputs.storeSignedMatch }}

    env:
      PACKAGE_NAME: ${{ needs.parse.outputs.packageName }}

    steps:
      - name: Download Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"

      - name: Download from Google Play
        id: appDownload
        uses: ./.github/actions/download-apk-apkeep
        with:
          packageName: ${{ env.PACKAGE_NAME }}
        env:
          GPLAY_EMAIL: ${{ secrets.GPLAY_EMAIL }}
          GPLAY_AAS_TOKEN: ${{ secrets.GPLAY_AAS_TOKEN }}

      - name: Verify APK signature
        id: verify
        if: steps.appDownload.outputs.found == 'true'
        uses: ./.github/actions/verify-store-apk
        with:
          apkPath: ${{ steps.appDownload.outputs.apkPath }}
          packageName: ${{ env.PACKAGE_NAME }}
          userSignature: ${{ needs.parse.outputs.packageSignature }}

  apkpure:
    name: APKPure
    runs-on: ubuntu-latest
    needs: parse
    cache-mode: write
    concurrency:
      group: apkpure-downloads
      cancel-in-progress: false
      queue: max

    if: >-
      needs.parse.outputs.isDuplicate != 'true' &&
      (
        github.event.label.name == 'Run Checks' ||
        github.event.label.name == 'Create PR' ||
        github.event.label.name == 'Commit As-Is'
      ) &&
      needs.parse.outputs.checkApkpure == 'true'
    continue-on-error: true
    permissions:
      contents: read

    outputs:
      found: ${{ steps.appDownload.outputs.found }}
      signature: ${{ steps.verify.outputs.signature }}
      apkSha256: ${{ steps.verify.outputs.apkSha256 }}
      match: ${{ steps.verify.outputs.status }}
      packageName: ${{ steps.verify.outputs.matchPackageName }}
      infoNote: ${{ steps.verify.outputs.infoNote }}
      storeSignedMatch: ${{ steps.verify.outputs.storeSignedMatch }}

    env:
      PACKAGE_NAME: ${{ needs.parse.outputs.packageName }}

    steps:
      - name: Download Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"

      - name: Download from APKPure
        id: appDownload
        uses: ./.github/actions/download-apk-apkeep
        with:
          packageName: ${{ env.PACKAGE_NAME }}
          source: apk-pure

      - name: Verify APK signature
        id: verify
        if: steps.appDownload.outputs.found == 'true'
        uses: ./.github/actions/verify-store-apk
        with:
          apkPath: ${{ steps.appDownload.outputs.apkPath }}
          packageName: ${{ env.PACKAGE_NAME }}
          userSignature: ${{ needs.parse.outputs.packageSignature }}

  directApk:
    name: Direct APK Link
    runs-on: ubuntu-latest
    needs: parse
    if: needs.parse.outputs.isDuplicate != 'true' && (github.event.label.name == 'Run Checks' || github.event.label.name == 'Create PR' || github.event.label.name == 'Commit As-Is') && needs.parse.outputs.apkUrl != ''
    continue-on-error: true
    permissions:
      contents: read

    outputs:
      signature: ${{ steps.verify.outputs.signature }}
      apkSha256: ${{ steps.verify.outputs.apkSha256 }}
      match: ${{ steps.verify.outputs.status }}
      packageName: ${{ steps.verify.outputs.matchPackageName }}
      infoNote: ${{ steps.verify.outputs.infoNote }}
      storeSignedMatch: ${{ steps.verify.outputs.storeSignedMatch }}

    env:
      PACKAGE_NAME: ${{ needs.parse.outputs.packageName }}
      APK_URL: ${{ needs.parse.outputs.apkUrl }}

    steps:
      - name: Download Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"

      - name: APK cache key
        id: apkCacheKey
        run: |
          url_hash=$(printf '%s' "$APK_URL" | sha256sum | awk '{print $1}')
          echo "cacheKey=direct-apk-${url_hash}" >> "$GITHUB_OUTPUT"

      - name: Restore APK Cache
        id: apkCache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: direct-apk.apk
          key: ${{ steps.apkCacheKey.outputs.cacheKey }}

      - name: Download APK
        if: steps.apkCache.outputs.cache-hit != 'true'
        env:
          # Authenticate GitHub release-asset downloads; anonymous downloads from shared runner IPs
          # get rate-limited/blocked. Used by signatures_download_direct_apk for github.com URLs.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/actions/signature-lib/signatures.lib.sh
          signatures_download_direct_apk "$APK_URL" direct-apk.apk

      - name: Verify APK signature
        id: verify
        uses: ./.github/actions/verify-store-apk
        with:
          apkPath: direct-apk.apk
          packageName: ${{ env.PACKAGE_NAME }}
          userSignature: ${{ needs.parse.outputs.packageSignature }}

  appverifierDb:
    name: AppVerifier
    runs-on: ubuntu-latest
    needs: parse
    if: needs.parse.outputs.isDuplicate != 'true' && (github.event.label.name == 'Run Checks' || github.event.label.name == 'Create PR' || github.event.label.name == 'Commit As-Is')
    continue-on-error: true
    permissions:
      contents: read

    outputs:
      found: ${{ steps.lookup.outputs.found }}
      signature: ${{ steps.lookup.outputs.signature }}
      allFingerprints: ${{ steps.lookup.outputs.allFingerprints }}
      match: ${{ steps.matches.outputs.status }}
      packageName: ${{ steps.matches.outputs.packageName }}
      infoNote: ${{ steps.combinedNote.outputs.infoNote }}
      storeSignedMatch: ${{ steps.matches.outputs.storeSignedMatch }}

    env:
      PACKAGE_NAME: ${{ needs.parse.outputs.packageName }}

    steps:
      - name: Download Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"

      - name: Lookup internal database fingerprints
        id: lookup
        uses: ./.github/actions/lookup-appverifier-database
        with:
          packageName: ${{ env.PACKAGE_NAME }}
          userSignature: ${{ needs.parse.outputs.packageSignature }}

      - name: Matches User-Provided?
        id: matches
        if: steps.lookup.outputs.found == 'true'
        uses: ./.github/actions/match-signature
        with:
          packageName: ${{ env.PACKAGE_NAME }}
          userSignature: ${{ needs.parse.outputs.packageSignature }}
          storeSignature: ${{ steps.lookup.outputs.signature }}

      - name: Combine informational notes
        if: steps.lookup.outputs.found == 'true'
        id: combinedNote
        env:
          LOOKUP_NOTE: ${{ steps.lookup.outputs.infoNote }}
          MATCH_NOTE: ${{ steps.matches.outputs.infoNote }}
        run: |
          note=""
          if [[ -n "$LOOKUP_NOTE" ]]; then
            note="$LOOKUP_NOTE"
          fi
          if [[ -n "$MATCH_NOTE" ]]; then
            if [[ -n "$note" ]]; then
              note+=$'\n\n'
            fi
            note+="$MATCH_NOTE"
          fi
          if [[ -n "$note" ]]; then
            source .github/actions/signature-lib/signatures.lib.sh
            gha_write_multiline_output infoNote "$note"
          else
            echo "infoNote=" >> "$GITHUB_OUTPUT"
          fi

      - name: Write Summary
        id: summary
        if: steps.lookup.outputs.found == 'true'
        env:
          SIGNATURE: ${{ steps.lookup.outputs.signature }}
          SOURCES: ${{ steps.lookup.outputs.sources }}
        run: |
          echo "$PACKAGE_NAME" >> $GITHUB_STEP_SUMMARY
          echo "Sources in AppVerifier database: $SOURCES" >> $GITHUB_STEP_SUMMARY
          echo "$SIGNATURE" >> $GITHUB_STEP_SUMMARY

  domainCheck:
    name: Verified Domain
    runs-on: ubuntu-latest
    needs: parse
    if: needs.parse.outputs.isDuplicate != 'true' && (github.event.label.name == 'Run Checks' || github.event.label.name == 'Create PR' || github.event.label.name == 'Commit As-Is')
    continue-on-error: true
    permissions:
      contents: read

    outputs:
      found: ${{ steps.domain.outputs.found }}
      method: ${{ steps.domain.outputs.method }}
      domain: ${{ steps.domain.outputs.domain }}
      status: ${{ steps.domain.outputs.status }}
      dnssec: ${{ steps.domain.outputs.dnssec }}
      recordJson: ${{ steps.domain.outputs.recordJson }}
      tableRow: ${{ steps.domain.outputs.tableRow }}

    steps:
      - name: Download Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"

      - name: Check verified domain
        id: domain
        uses: ./.github/actions/domain-verify
        with:
          packageName: ${{ needs.parse.outputs.packageName }}
          packageSignature: ${{ needs.parse.outputs.packageSignature }}

      - name: Write job summary
        if: steps.domain.outputs.found == 'true'
        env:
          DOMAIN_TABLE_ROW: ${{ steps.domain.outputs.tableRow }}
        run: |
          {
            echo "| Source | Matches | Verification |"
            echo "|---|---|---|"
            printf '%s\n' "$DOMAIN_TABLE_ROW"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Generate Summary
    runs-on: ubuntu-latest
    needs: [parse, fdroid, customFdroid, gplay, apkpure, appverifierDb, directApk, domainCheck]

    if: always() && needs.parse.result == 'success' && needs.parse.outputs.isDuplicate != 'true' && github.event.label.name == 'Run Checks'
    permissions:
      contents: read
      issues: write

    steps:
      - name: Download Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"

      - name: Download F-Droid results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fdroid-result-*
          merge-multiple: true
          path: fdroid-results

      # One row per source, in table order. Every later step reads this file, so whether a
      # source matched is decided in one place.
      - name: Collect what each source found
        env:
          USER_SIG: ${{ needs.parse.outputs.packageSignature }}
          APK_URL: ${{ needs.parse.outputs.apkUrl }}
          CHECK_APKPURE: ${{ needs.parse.outputs.checkApkpure }}
          GPLAY: ${{ toJSON(needs.gplay.outputs) }}
          APKPURE: ${{ toJSON(needs.apkpure.outputs) }}
          APPVERIFIER: ${{ toJSON(needs.appverifierDb.outputs) }}
          DIRECT: ${{ toJSON(needs.directApk.outputs) }}
        run: |
          set -euo pipefail
          source .github/actions/signature-lib/signatures.lib.sh
          rows="${RUNNER_TEMP}/sources.jsonl"
          : > "$rows"

          # add <result json> <name in the table> <label when it matches> <is a store: true|false>
          add() {
            local equal=false
            if [[ "$(jq -r '.found' <<< "$1")" == "true" ]] \
              && signatures_equal "$(jq -r '.signature // ""' <<< "$1")" "$USER_SIG"; then
              equal=true
            fi
            jq -c --arg name "$2" --arg tag "$3" --argjson store "$4" --argjson equal "$equal" '{
              name: $name,
              "label": $tag,
              store: $store,
              equal: $equal,
              found: (.found | tostring == "true"),
              match: (.match // ""),
              packageName: (.packageName // ""),
              signature: (.signature // ""),
              infoNote: (.infoNote // ""),
              storeSigned: (.storeSignedMatch | tostring == "true")
            }' <<< "$1" >> "$rows"
          }

          while IFS= read -r file; do
            repo=$(jq -r '.repoName' "$file")
            # A repo the submitter named is not a store, same as a direct APK link.
            if signatures_is_known_fdroid_matrix_repo "$repo"; then
              add "$(cat "$file")" "F-Droid (${repo})" "Match ${repo}" true
            else
              add "$(cat "$file")" "F-Droid (${repo})" "" false
            fi
          done < <(find fdroid-results -type f -name '*.json' 2>/dev/null | sort)
          add "$GPLAY" "Google Play" "Match Play" true
          if [[ "$CHECK_APKPURE" == "true" ]]; then
            add "$APKPURE" "APKPure" "Match APKPure" true
          fi
          add "$APPVERIFIER" "AppVerifier" "Match Appverifier" false
          if [[ -n "$APK_URL" ]]; then
            # The direct link job has no "found" flag: it is listed whenever a link was given.
            add "$(jq -c '. + {found: "true"}' <<< "$DIRECT")" "Direct APK Link" "" false
          fi

          jq -s '.' "$rows" > "${RUNNER_TEMP}/sources.json"
          cat "${RUNNER_TEMP}/sources.json"

      - name: Write the results table
        env:
          USER_PKG: ${{ needs.parse.outputs.packageName }}
          USER_SIG: ${{ needs.parse.outputs.packageSignature }}
          CHECK_APKPURE: ${{ needs.parse.outputs.checkApkpure }}
          AV_FOUND: ${{ needs.appverifierDb.outputs.found }}
          APK_URL: ${{ needs.parse.outputs.apkUrl }}
          CUSTOM_FDROID_REPO_URL: ${{ needs.parse.outputs.customFdroidRepoUrl }}
          DOMAIN_TABLE_ROW: ${{ needs.domainCheck.outputs.found == 'true' && needs.domainCheck.outputs.tableRow || '' }}
        run: |
          set -euo pipefail
          intro="We attempted to check F-Droid (F-Droid and IzzyOnDroid), Google Play"
          if [[ "$AV_FOUND" == "true" ]]; then intro+=", AppVerifier's internal database"; fi
          if [[ -n "$CUSTOM_FDROID_REPO_URL" ]]; then intro+=", your custom F-Droid repository"; fi
          if [[ -n "$APK_URL" ]]; then intro+=", your direct APK link"; fi
          if [[ "$CHECK_APKPURE" == "true" ]]; then intro+=", APKPure"; fi
          if [[ -n "$DOMAIN_TABLE_ROW" ]]; then intro+=", your app's verified domain"; fi
          {
            echo "${intro} for this app. If we found any results, they'll be in the table below:"
            echo ""
            echo "| Source | Matches | Verification |"
            echo "|---|---|---|"
            echo "| User-Provided | :arrow_down: | ${USER_PKG}<br>${USER_SIG//$'\n'/<br>} |"
            jq -r --arg domain "$DOMAIN_TABLE_ROW" '
              def row: "| \(.name) | \(.match) | \(.packageName)<br>\(.signature | gsub("\n"; "<br>")) |";
              (.[] | select(.found and .name != "Direct APK Link") | row),
              ($domain | select(. != "")),
              (.[] | select(.name == "Direct APK Link") | row)
            ' "${RUNNER_TEMP}/sources.json"
            if [[ -n "$APK_URL" ]]; then
              echo ""
              echo ":exclamation: We scanned the APK file at \`${APK_URL}\` which the submitter provided. This does not indicate its legitimacy, you must confirm this is a legitimate source."
            fi
            if [[ -n "$CUSTOM_FDROID_REPO_URL" ]]; then
              echo ""
              echo ":exclamation: We checked the F-Droid repository at \`${CUSTOM_FDROID_REPO_URL}\` which the submitter provided. This does not indicate its legitimacy, you must confirm this is a legitimate source."
            fi
          } > "${RUNNER_TEMP}/issueBody.md"

      - name: Find related packages in data.yml
        id: relatedPackages
        uses: ./.github/actions/signature-lib
        with:
          operation: find-related-packages
          packageName: ${{ needs.parse.outputs.packageName }}
          packageSignature: ${{ needs.parse.outputs.packageSignature }}

      - name: Append matching fingerprints from other packages
        if: steps.relatedPackages.outputs.relatedLines != ''
        env:
          RELATED_LINES: ${{ steps.relatedPackages.outputs.relatedLines }}
        run: |
          {
            echo ""
            echo "This fingerprint matches another app already confirmed in our database! This may indicate it's from the same developer, you should check. If so, this is a stronger indication that this submission is legitimate:"
            echo ""
            echo "$RELATED_LINES"
          } >> "${RUNNER_TEMP}/issueBody.md"

      - name: Append each source's note once
        run: |
          set -euo pipefail
          jq -r '
            reduce (.[].infoNote | select(. != "")) as $note ([];
              if any(.[]; . == $note) then . else . + [$note] end)
            | .[] | "\n" + .
          ' "${RUNNER_TEMP}/sources.json" >> "${RUNNER_TEMP}/issueBody.md"

      - name: Count matches
        id: count
        run: |
          set -euo pipefail
          jq -r '
            "sources=\(map(select(.found)) | length)",
            "matches=\(map(select(.equal)) | length)",
            "storeMatches=\(map(select(.equal and .store)) | length)",
            "storeSigned=\(any(.[]; .equal and .storeSigned))",
            "hasNotes=\(any(.[]; .infoNote != ""))"
          ' "${RUNNER_TEMP}/sources.json" | tee -a "$GITHUB_OUTPUT"

      - name: Report how many sources matched
        if: steps.count.outputs.matches != '0'
        env:
          MATCHES: ${{ steps.count.outputs.matches }}
          SOURCES: ${{ steps.count.outputs.sources }}
        run: |
          printf '\n%s\n' "${MATCHES}/${SOURCES} of our sources matched what was provided. Some mismatches between app stores can be normal." >> "${RUNNER_TEMP}/issueBody.md"

      - name: Report that no source matched
        if: steps.count.outputs.matches == '0'
        run: |
          printf '\n%s\n' "We either weren't able to grab this app from stores, or no stores matched it. Please provide a link to exactly where you downloaded it, thanks!" >> "${RUNNER_TEMP}/issueBody.md"

      - name: Point to the notes when no source matched
        if: steps.count.outputs.matches == '0' && steps.count.outputs.hasNotes == 'true'
        run: |
          printf '\n%s\n' "None of our sources matched the fingerprint you provided exactly, but see the notes above: For example, **Google Play App Signing** or **non-reproducible F-Droid builds** can explain a mismatch without indicating a bad submission." >> "${RUNNER_TEMP}/issueBody.md"

      - name: Append as-is database preview
        env:
          PACKAGE: ${{ needs.parse.outputs.packageName }}
          USER_SIG: ${{ needs.parse.outputs.packageSignature }}
          ISSUE: ${{ github.event.issue.number }}
          SUBMISSION_ISSUE_REF: ${{ needs.parse.outputs.submissionIssueRef }}
          DOMAIN_VERIFIED_SIG: ${{ needs.domainCheck.outputs.status == 'allowed' && needs.parse.outputs.packageSignature || '' }}
          DOMAIN_VERIFIED_METHOD: ${{ needs.domainCheck.outputs.method }}
          FDROID_RESULTS_DIR: fdroid-results
          GPLAY_SIG: ${{ needs.gplay.outputs.signature }}
          APKPURE_SIG: ${{ needs.apkpure.outputs.signature }}
          APPVERIFIER_SIG: ${{ needs.appverifierDb.outputs.signature }}
          DIRECT_SIG: ${{ needs.directApk.outputs.signature }}
          DIRECT_APK_URL: ${{ needs.parse.outputs.apkUrl }}
          DIRECT_APK_SHA256: ${{ needs.directApk.outputs.apkSha256 }}
          CUSTOM_FDROID_REPO_URL: ${{ needs.parse.outputs.customFdroidRepoUrl }}
          CUSTOM_FDROID_APK_SHA256: ${{ needs.customFdroid.outputs.apkSha256 }}
          GPLAY_APK_SHA256: ${{ needs.gplay.outputs.apkSha256 }}
          APKPURE_APK_SHA256: ${{ needs.apkpure.outputs.apkSha256 }}
        run: |
          set -euo pipefail
          source .github/actions/signature-lib/signatures.lib.sh
          issue_body="${RUNNER_TEMP}/issueBody.md"
          entry="$(mktemp)"
          if ! submission_build_entry_file "$entry"; then
            {
              echo ""
              echo "We could not build a database entry from store matches alone, so there is no as-is preview. Add the **Create PR** label after review if you want to merge signatures manually."
            } >> "$issue_body"
            rm -f "$entry"
            exit 0
          fi
          preview="$(submission_format_package_merge_diff "$entry")"
          rm -f "$entry"
          {
            echo ""
            echo "If committed as-is, \`data.yml\` would change as follows (store signatures that matched the submitter's fingerprint):"
            echo ""
            echo '```diff'
            printf '%s\n' "$preview"
            echo '```'
            echo ""
            echo "Maintainers: add **Commit As-Is** to accept this entry on \`main\` immediately, or **Create PR** to open a pull request for manual edits first."
          } >> "$issue_body"

      # Commit As-Is only runs while the issue text still has this hash (see "Check the issue
      # text is the one that was checked" in commitAsIsPrepare). The marker must stay on a line
      # of its own: that is what stops text quoted from the submission passing for it.
      - name: Record which issue text was checked
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          body_hash=$(printf '%s' "$ISSUE_BODY" | sha256sum | cut -d' ' -f1)
          printf '\n<!-- pg-checked-body: %s -->\n' "$body_hash" >> "${RUNNER_TEMP}/issueBody.md"

      - name: Show the comment in the job summary
        run: cat "${RUNNER_TEMP}/issueBody.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on Issue
        uses: ./.github/actions/issue-comment
        with:
          issueNumber: ${{ github.event.issue.number }}
          bodyFile: ${{ runner.temp }}/issueBody.md
          issueBody: ${{ github.event.issue.body }}
          codebergToken: ${{ secrets.CB_SYNC_TOKEN }}

      - name: Label the issue by what matched
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          STORE_MATCHES: ${{ steps.count.outputs.storeMatches }}
          STORE_SIGNED: ${{ steps.count.outputs.storeSigned }}
        run: |
          set -euo pipefail
          label_args=()
          while IFS= read -r label; do
            label_args+=(--add-label "$label")
          done < <(jq -r '.[] | select(.equal and .label != "") | .label' "${RUNNER_TEMP}/sources.json")
          if [[ "$STORE_MATCHES" == "0" ]]; then label_args+=(--add-label "No Store Match"); fi
          if [[ "$STORE_SIGNED" == "true" ]]; then label_args+=(--add-label "Store Signed"); fi
          if [[ ${#label_args[@]} -gt 0 ]]; then
            gh issue edit "$NUMBER" --repo "$GH_REPO" "${label_args[@]}"
          fi

      - name: Remove Run Checks label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$NUMBER" --repo "$GH_REPO" --remove-label "Run Checks" || true

  createPr:
    name: Create PR
    runs-on: ubuntu-latest
    concurrency:
      group: data-yml-writes
      cancel-in-progress: false
      queue: max
    needs: [parse, fdroid, customFdroid, gplay, apkpure, appverifierDb, directApk]
    if: |
      always() &&
      !cancelled() &&
      needs.parse.result == 'success' &&
      needs.parse.outputs.isDuplicate != 'true' &&
      github.event.label.name == 'Create PR'

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Download Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"
      
      - name: Check merge-blocking labels
        uses: ./.github/actions/check-do-not-merge
        with:
          issueNumber: ${{ github.event.issue.number }}
          actionDescription: Create PR
          issueBody: ${{ github.event.issue.body }}
          codebergToken: ${{ secrets.CB_SYNC_TOKEN }}

      - name: Check for existing PR
        id: existingPr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          branch="new/${ISSUE}"
          existing_pr=$(gh pr list --repo "$GH_REPO" --head "$branch" --json url -q '.[0].url' || true)
          echo "url=$existing_pr" >> "$GITHUB_OUTPUT"

      - name: Comment if PR already exists
        if: steps.existingPr.outputs.url != ''
        uses: ./.github/actions/issue-comment
        with:
          issueNumber: ${{ github.event.issue.number }}
          body: "A pull request already exists for this submission: ${{ steps.existingPr.outputs.url }}"
          issueBody: ${{ github.event.issue.body }}
          codebergToken: ${{ secrets.CB_SYNC_TOKEN }}

      - name: Resolve submitter source
        if: steps.existingPr.outputs.url == ''
        id: submitterSource
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          source "${GITHUB_WORKSPACE}/.github/actions/signature-lib/signatures.lib.sh"
          app_source=$(signatures_parse_issue_field "Submitted app source|App Source" "$ISSUE_BODY" true || true)
          if [[ -z "$app_source" ]]; then
            app_source="Submission"
          fi
          echo "value=$app_source" >> "$GITHUB_OUTPUT"

      - name: Build PR body
        if: steps.existingPr.outputs.url == ''
        env:
          ISSUE: ${{ github.event.issue.number }}
          SUBMISSION_ISSUE_REF: ${{ needs.parse.outputs.submissionIssueRef }}
        run: |
          set -euo pipefail
          submission_ref="${SUBMISSION_ISSUE_REF:-GH-${ISSUE}}"
          {
            echo "**Agree with these changes? Please add a :+1: reaction to this PR!**"
            echo ""
            echo "A maintainer requested this PR from issue ${submission_ref}."
            echo "These entries should be verified manually (or additional entries can be added) before merging."
            echo "This PR adds signatures from stores that matched what the submitter provided, when verification was run."
            echo "See the verification comment on the issue for full details."
            echo ""
            echo "Closes GH-${ISSUE}"
          } > "${RUNNER_TEMP}/prBody.md"

      - name: Checkout repository
        if: steps.existingPr.outputs.url == ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download F-Droid results
        if: steps.existingPr.outputs.url == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fdroid-result-*
          merge-multiple: true
          path: fdroid-results

      - name: Check for matching store signatures
        if: steps.existingPr.outputs.url == ''
        id: storeMatches
        env:
          USER_SIG: ${{ needs.parse.outputs.packageSignature }}
          GPLAY_SIG: ${{ needs.gplay.outputs.signature }}
          APKPURE_SIG: ${{ needs.apkpure.outputs.signature }}
          APPVERIFIER_SIG: ${{ needs.appverifierDb.outputs.signature }}
          DIRECT_SIG: ${{ needs.directApk.outputs.signature }}
        run: |
          set -euo pipefail
          source .github/actions/signature-lib/signatures.lib.sh
          matched=false
          if [[ -n "$GPLAY_SIG" ]] && signatures_equal "$GPLAY_SIG" "$USER_SIG"; then
            matched=true
          fi
          if [[ -n "$APKPURE_SIG" ]] && signatures_equal "$APKPURE_SIG" "$USER_SIG"; then
            matched=true
          fi
          if [[ -n "$APPVERIFIER_SIG" ]] && signatures_equal "$APPVERIFIER_SIG" "$USER_SIG"; then
            matched=true
          fi
          if [[ -n "$DIRECT_SIG" ]] && signatures_equal "$DIRECT_SIG" "$USER_SIG"; then
            matched=true
          fi
          while IFS= read -r result_file; do
            [[ -z "$result_file" ]] && continue
            [[ "$(jq -r '.found' "$result_file")" != "true" ]] && continue
            sig=$(jq -r '.signature' "$result_file")
            if signatures_equal "$sig" "$USER_SIG"; then
              matched=true
            fi
          done < <(find fdroid-results -type f -name '*.json' 2>/dev/null)
          echo "matched=$matched" >> "$GITHUB_OUTPUT"

      - name: Set PR signature mode
        if: steps.existingPr.outputs.url == ''
        id: prSignatureMode
        env:
          MATCHED: ${{ steps.storeMatches.outputs.matched }}
          SUBMITTER_SOURCE: ${{ steps.submitterSource.outputs.value }}
        run: |
          if [[ "$MATCHED" == "true" ]]; then
            echo "submitterSource=" >> "$GITHUB_OUTPUT"
          else
            echo "submitterSource=$SUBMITTER_SOURCE" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve co-authors
        if: steps.existingPr.outputs.url == ''
        id: coauthor
        uses: ./.github/actions/resolve-submission-coauthors
        with:
          labelerLogin: ${{ github.event.sender.login }}
          labelerId: ${{ github.event.sender.id }}
          submitterLogin: ${{ github.event.issue.user.login }}
          submitterId: ${{ github.event.issue.user.id }}
          issueBody: ${{ github.event.issue.body }}
          codebergToken: ${{ secrets.CB_SYNC_TOKEN }}

      - name: Create PR
        id: createPr
        if: steps.existingPr.outputs.url == ''
        uses: ./.github/actions/create-submission-pr
        with:
          packageName: ${{ needs.parse.outputs.packageName }}
          packageSignature: ${{ needs.parse.outputs.packageSignature }}
          issueNumber: ${{ github.event.issue.number }}
          issueBody: ${{ github.event.issue.body }}
          prBodyFile: ${{ runner.temp }}/prBody.md
          coAuthorTrailer: ${{ steps.coauthor.outputs.trailer }}
          author: ${{ steps.coauthor.outputs.author }}
          sshSigningKey: ${{ secrets.ACTIONS_SSH_KEY }}
          fdroidResultsDir: fdroid-results
          gplaySignature: ${{ needs.gplay.outputs.signature }}
          apkpureSignature: ${{ needs.apkpure.outputs.signature }}
          appverifierSignature: ${{ needs.appverifierDb.outputs.signature }}
          directApkSignature: ${{ needs.directApk.outputs.signature }}
          directApkLink: ${{ needs.parse.outputs.apkUrl }}
          directApkSha256: ${{ needs.directApk.outputs.apkSha256 }}
          customFdroidRepoUrl: ${{ needs.parse.outputs.customFdroidRepoUrl }}
          customFdroidApkSha256: ${{ needs.customFdroid.outputs.apkSha256 }}
          gplayApkSha256: ${{ needs.gplay.outputs.apkSha256 }}
          apkpureApkSha256: ${{ needs.apkpure.outputs.apkSha256 }}
          submitterSource: ${{ steps.prSignatureMode.outputs.submitterSource }}

      - name: Comment with PR link
        if: steps.createPr.outputs.prCreated == 'true'
        uses: ./.github/actions/issue-comment
        with:
          issueNumber: ${{ github.event.issue.number }}
          body: "Opened pull request: ${{ steps.createPr.outputs.prUrl }}"
          issueBody: ${{ github.event.issue.body }}
          codebergToken: ${{ secrets.CB_SYNC_TOKEN }}

      - name: Report skipped PR
        if: steps.existingPr.outputs.url == '' && steps.createPr.outputs.skipped == 'true'
        uses: ./.github/actions/issue-comment
        with:
          issueNumber: ${{ github.event.issue.number }}
          body: "Could not open a PR: no store signatures matched the submission. Add matching store entries manually, or ensure verification was run with the **Run Checks** label first."
          issueBody: ${{ github.event.issue.body }}
          codebergToken: ${{ secrets.CB_SYNC_TOKEN }}

  commitAsIsPrepare:
    name: Commit As-Is (prepare)
    runs-on: ubuntu-latest
    # No data-yml-writes lock: this job only builds the entry delta (read-only). Holding the
    # lock here would risk GitHub cancelling a queued prepare and dropping a submission; the
    # actual write is serialized in commitAsIsPush, which re-applies onto the latest main.
    needs: [parse, fdroid, customFdroid, gplay, apkpure, appverifierDb, directApk, domainCheck]
    if: |
      always() &&
      !cancelled() &&
      needs.parse.result == 'success' &&
      needs.parse.outputs.isDuplicate != 'true' &&
      github.event.label.name == 'Commit As-Is'

    permissions:
      contents: write
      issues: write

    outputs:
      prepared: ${{ steps.commit.outputs.prepared }}
      skipped: ${{ steps.commit.outputs.skipped }}
      author: ${{ steps.coauthor.outputs.author }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Check merge-blocking labels
        uses: ./.github/actions/check-do-not-merge
        with:
          issueNumber: ${{ github.event.issue.number }}
          actionDescription: Commit As-Is
          issueBody: ${{ github.event.issue.body }}
          codebergToken: ${{ secrets.CB_SYNC_TOKEN }}

      - name: Check the issue text is the one that was checked
        id: bodyCheck
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          current=$(printf '%s' "$ISSUE_BODY" | sha256sum | cut -d' ' -f1)
          # Newest marker wins. Only whole lines in the bot's own comments count.
          checked=$(gh api --paginate "repos/${GH_REPO}/issues/${NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body' \
            | tr -d '\r' | grep -xE '<!-- pg-checked-body: [0-9a-f]{64} -->' | tail -n 1 \
            | grep -oE '[0-9a-f]{64}' || true)
          if [[ "$checked" == "$current" ]]; then
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          else
            echo "unchanged=false" >> "$GITHUB_OUTPUT"
            echo "Checked text hash: ${checked:-none}; current: ${current}" >&2
          fi

      - name: Report an edited or unchecked issue
        if: steps.bodyCheck.outputs.unchanged != 'true'
        uses: ./.github/actions/issue-comment
        with:
          issueNumber: ${{ github.event.issue.number }}
          body: "Cannot run **Commit As-Is**: this issue was edited after the last checks ran, or the checks have not run on it yet. Add the **Run Checks** label again, review the new result, then retry."
          issueBody: ${{ github.event.issue.body }}
          codebergToken: ${{ secrets.CB_SYNC_TOKEN }}

      - name: Stop when the issue text was not checked
        if: steps.bodyCheck.outputs.unchanged != 'true'
        run: exit 1

      - name: Download F-Droid results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fdroid-result-*
          merge-multiple: true
          path: fdroid-results

      - name: Resolve co-authors
        id: coauthor
        uses: ./.github/actions/resolve-submission-coauthors
        with:
          labelerLogin: ${{ github.event.sender.login }}
          labelerId: ${{ github.event.sender.id }}
          submitterLogin: ${{ github.event.issue.user.login }}
          submitterId: ${{ github.event.issue.user.id }}
          issueBody: ${{ github.event.issue.body }}
          codebergToken: ${{ secrets.CB_SYNC_TOKEN }}

      - name: Prepare submission data.yml
        id: commit
        uses: ./.github/actions/commit-submission
        with:
          packageName: ${{ needs.parse.outputs.packageName }}
          packageSignature: ${{ needs.parse.outputs.packageSignature }}
          issueNumber: ${{ github.event.issue.number }}
          issueBody: ${{ github.event.issue.body }}
          coAuthorTrailer: ${{ steps.coauthor.outputs.trailer }}
          fdroidResultsDir: fdroid-results
          gplaySignature: ${{ needs.gplay.outputs.signature }}
          apkpureSignature: ${{ needs.apkpure.outputs.signature }}
          appverifierSignature: ${{ needs.appverifierDb.outputs.signature }}
          directApkSignature: ${{ needs.directApk.outputs.signature }}
          directApkLink: ${{ needs.parse.outputs.apkUrl }}
          directApkSha256: ${{ needs.directApk.outputs.apkSha256 }}
          customFdroidRepoUrl: ${{ needs.parse.outputs.customFdroidRepoUrl }}
          customFdroidApkSha256: ${{ needs.customFdroid.outputs.apkSha256 }}
          gplayApkSha256: ${{ needs.gplay.outputs.apkSha256 }}
          apkpureApkSha256: ${{ needs.apkpure.outputs.apkSha256 }}
          domainVerifiedSig: ${{ needs.domainCheck.outputs.status == 'allowed' && needs.parse.outputs.packageSignature || '' }}
          domainMethod: ${{ needs.domainCheck.outputs.method }}

      # The push job re-merges this entry (the delta) onto the latest main, so we no longer
      # upload a whole-file data.yml snapshot here (committing one verbatim is what reverted
      # concurrent entries). data.yml is attested *after* it is committed, in the push step.
      - name: Upload submission entry (delta)
        if: steps.commit.outputs.prepared == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: submission-entry
          path: submission-entry.yml
          if-no-files-found: error

      - name: Upload commit message
        if: steps.commit.outputs.prepared == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: submission-commit-msg
          path: submission-commit-msg
          if-no-files-found: error

      - name: Report skipped commit
        if: steps.commit.outputs.skipped == 'true'
        uses: ./.github/actions/issue-comment
        with:
          issueNumber: ${{ github.event.issue.number }}
          body: "Could not commit as-is: no store signatures or verified domain matched the submission. Run **Run Checks** first, or use **Create PR** to add entries manually."
          issueBody: ${{ github.event.issue.body }}
          codebergToken: ${{ secrets.CB_SYNC_TOKEN }}

  commitAsIsPush:
    name: Commit As-Is (push)
    runs-on: ubuntu-latest
    concurrency:
      group: data-yml-writes
      cancel-in-progress: false
      queue: max
    needs: [commitAsIsPrepare, parse, domainCheck]
    if: |
      always() &&
      needs.commitAsIsPrepare.outputs.prepared == 'true'

    permissions:
      contents: write
      issues: write

    outputs:
      commitSha: ${{ steps.push.outputs.commitSha }}
      alreadyPresent: ${{ steps.push.outputs.alreadyPresent }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Download submission entry (delta)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: submission-entry
          path: .

      - name: Download commit message
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: submission-commit-msg
          path: .

      # Re-apply the entry (and any verified-domain row) onto the LATEST main inside a
      # compare-and-swap loop, then push. If main advanced since the entry was built, the
      # push is retried against the new tip — concurrent submissions never revert each other.
      - name: Commit to main (compare-and-swap)
        id: push
        env:
          SSH_KEY: ${{ secrets.ACTIONS_SSH_KEY }}
          AUTHOR: ${{ needs.commitAsIsPrepare.outputs.author }}
          PACKAGE: ${{ needs.parse.outputs.packageName }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          DOMAIN_STATUS: ${{ needs.domainCheck.outputs.status }}
          DV_DOMAIN: ${{ needs.domainCheck.outputs.domain }}
          DV_METHOD: ${{ needs.domainCheck.outputs.method }}
          DV_DNSSEC: ${{ needs.domainCheck.outputs.dnssec }}
          DV_RECORD_JSON: ${{ needs.domainCheck.outputs.recordJson }}
        run: |
          set -euo pipefail
          source .github/actions/domain-verify/domains.lib.sh

          ENTRY_FILE="submission-entry.yml"
          ISSUE_REF=$(signatures_submission_issue_ref "$ISSUE" "$ISSUE_BODY")
          CHECKED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DV_FPS="[]"
          if [[ -n "${DV_RECORD_JSON:-}" ]]; then DV_FPS=$(jq -c '.allowed // []' <<< "$DV_RECORD_JSON"); fi

          # Re-applied against the current main on every CAS attempt (both helpers dedupe).
          apply_delta() {
            submission_merge_entry_into_data_yml "$ENTRY_FILE" data.yml
            if [[ "${DOMAIN_STATUS:-}" == "allowed" && -n "${DV_DOMAIN:-}" ]]; then
              domain_verified_upsert "$DOMAIN_VERIFIED_FILE" "$DV_DOMAIN" "${DV_METHOD:-https}" \
                "$PACKAGE" "$ISSUE_REF" "$CHECKED" "${DV_DNSSEC:-}" "$DV_FPS"
            fi
          }

          key_file=$(submission_configure_git_signing "$SSH_KEY")
          trap 'rm -f "$key_file"' EXIT

          set +e
          sha=$(submission_cas_commit_push apply_delta main submission-commit-msg "$AUTHOR" \
            "$(printf 'data.yml\ndata-verified-domains.yml')")
          rc=$?
          set -e

          if [[ "$rc" -eq 0 ]]; then
            echo "commitSha=$sha" >> "$GITHUB_OUTPUT"
          elif [[ "$rc" -eq 3 ]]; then
            echo "commitSha=" >> "$GITHUB_OUTPUT"
            echo "alreadyPresent=true" >> "$GITHUB_OUTPUT"
            echo "Entry already present on main; nothing to commit."
          else
            echo "CAS commit to main failed (rc=$rc)" >&2
            exit 1
          fi

      - name: Upload committed data.yml for attestation
        if: steps.push.outputs.commitSha != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database
          path: data.yml
          if-no-files-found: error

  commitAsIsAttest:
    name: Commit As-Is (attest)
    needs: commitAsIsPush
    if: always() && needs.commitAsIsPush.outputs.commitSha != ''
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: privacyguides/.github/.github/workflows/sign-artifact.yml@5c41b37a937aab5e50262f3ab672fc9b9438dbf9
    with:
      artifact-name: database
      artifact-path: data.yml

  commitAsIsFinalize:
    name: Commit As-Is (finalize)
    runs-on: ubuntu-latest
    needs: [commitAsIsPush, commitAsIsAttest, parse]
    if: always() && needs.commitAsIsPush.outputs.commitSha != '' && needs.commitAsIsAttest.result == 'success'
    permissions:
      issues: write
    steps:
      - name: Download Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"

      - name: Comment on success
        uses: ./.github/actions/issue-comment
        with:
          issueNumber: ${{ github.event.issue.number }}
          body: "Committed `${{ needs.parse.outputs.packageName }}` to `data.yml` on `main` as submitted, and attested. Commit: ${{ needs.commitAsIsPush.outputs.commitSha }}"
          issueBody: ${{ github.event.issue.body }}
          codebergToken: ${{ secrets.CB_SYNC_TOKEN }}

  syncMirrorsAfterCommitAsIs:
    name: Sync mirrors (commit as-is)
    needs: commitAsIsPush
    if: |
      always() &&
      !cancelled() &&
      needs.commitAsIsPush.result == 'success'
    uses: ./.github/workflows/sync-repo-to-mirrors.yml
    secrets: inherit

  syncCodebergAfterCommitAsIs:
    name: Sync Codeberg issue state (commit as-is)
    needs: commitAsIsPush
    if: |
      always() &&
      !cancelled() &&
      needs.commitAsIsPush.result == 'success' &&
      contains(github.event.issue.labels.*.name, 'Import Codeberg')
    uses: ./.github/workflows/sync-codeberg-issue-state.yml
    secrets: inherit
    with:
      issueNumber: ${{ github.event.issue.number }}
      issueBody: ${{ github.event.issue.body }}
      issueAction: closed
